name: "🌙 Refresh Venue Data"

on:
  schedule:
    # Midnight PST = 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

# Restrict default token to read-only; escalate per-job as needed
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run venue refresher
        run: python scripts/refresh.py
        env:
          RESY_API_KEY: ${{ secrets.RESY_API_KEY }}
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/venues.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🌙 Auto-refresh venue data $(date -u +%Y-%m-%d)"
            git push
          fi
