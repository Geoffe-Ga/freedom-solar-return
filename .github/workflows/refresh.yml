name: "🌙 Refresh Venue Data"

on:
  schedule:
    # Midnight PST = 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.repository == 'geoffe-ga/freedom-solar-return'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run venue refresher
        run: python scripts/refresh.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add data/venues.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🌙 Auto-refresh venue data $(date -u +%Y-%m-%d)"
            git push
          fi
